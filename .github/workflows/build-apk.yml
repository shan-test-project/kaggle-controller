name: Build Kaggle Controller APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Download and use Gradle 8.5 (compatible with AGP 8.2.2)
        run: |
          curl -L -o gradle-8.5-bin.zip https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          echo "GRADLE_8_5=$PWD/gradle-8.5" >> $GITHUB_ENV
          echo "$PWD/gradle-8.5/bin" >> $GITHUB_PATH
          echo "Using Gradle: $(gradle --version | head -1)"
      - name: Regenerate debug keystore
        run: |
          bash generate-debug-keystore.sh || true
          keytool -genkey -v -keystore debug.keystore -alias kaggle-debug -keyalg RSA -keysize 2048 -validity 10000 -storepass kaggle-debug -keypass kaggle-debug -dname "CN=Kaggle Controller, OU=Dev, O=Kaggle" -noprompt 2>/dev/null || echo "Keystore OK"
      - name: Build Release APK (full R8 v8a)
        run: |
          cd kaggle-controller
          bash gradlew assembleRelease --stacktrace --info
        env:
          STORE_FILE: ../debug.keystore
          STORE_PASSWORD: kaggle-debug
          KEY_ALIAS: kaggle-debug
          KEY_PASSWORD: kaggle-debug
      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KaggleController-v1.0.0001-release
          path: |
            kaggle-controller/app/build/outputs/apk/**/*.apk
      - name: Show APK info
        if: always()
        run: |
          echo "=== APK INFO ==="
          find . -name "*.apk" 2>/dev/null || echo "No APK"
