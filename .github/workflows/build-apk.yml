name: Build Kaggle Controller APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure forever-use debug keystore
        run: |
          if [ -f generate-debug-keystore.sh ]; then
            chmod +x generate-debug-keystore.sh
            bash generate-debug-keystore.sh
          fi
          # If keytool exists, regenerate the exact same keystore
          if command -v keytool >/dev/null 2>&1; then
            keytool -genkey -v -keystore debug.keystore -alias kaggle-debug -keyalg RSA -keysize 2048 -validity 10000 -storepass kaggle-debug -keypass kaggle-debug -dname "CN=Kaggle Controller, OU=Dev, O=Kaggle, L=City, ST=State, C=US" -noprompt 2>/dev/null || echo "Keystore already exists or keytool unavailable"
          else
            echo "keytool will be available in build environment"
          fi
        working-directory: .

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build Release APK with consistent debug signing
        run: ./gradlew assembleRelease
        working-directory: ./kaggle-controller/
        env:
          STORE_FILE: debug.keystore
          STORE_PASSWORD: kaggle-debug
          KEY_ALIAS: kaggle-debug
          KEY_PASSWORD: kaggle-debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KaggleController-v1.0.0001-release
          path: kaggle-controller/app/build/outputs/apk/release/*.apk

      - name: Show APK info
        run: |
          echo "=== APK Info ==="
          ls -lh kaggle-controller/app/build/outputs/apk/release/*.apk || echo "No APK found"
