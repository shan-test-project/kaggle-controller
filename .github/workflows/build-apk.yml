name: Build Kaggle Controller APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 platform
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.9
        run: |
          curl --fail --location --silent --show-error \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            --output "$RUNNER_TEMP/gradle-8.9-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle-8.9-bin.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Create temporary test-signing key
        run: |
          STORE_FILE="$RUNNER_TEMP/kaggle-controller-test.jks"
          STORE_PASSWORD="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          KEY_ALIAS="kaggle-controller-test"
          keytool -genkeypair -noprompt \
            -keystore "$STORE_FILE" \
            -storetype JKS \
            -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -storepass "$STORE_PASSWORD" \
            -keypass "$STORE_PASSWORD" \
            -dname "CN=Kaggle Controller CI, O=Test"
          echo "::add-mask::$STORE_PASSWORD"
          {
            echo "STORE_FILE=$STORE_FILE"
            echo "STORE_PASSWORD=$STORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$STORE_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build signed release APK
        run: gradle assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KaggleController-v0.1.0-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error